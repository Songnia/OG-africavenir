<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <g opacity="0.9">
    <!-- Ombre -->
    <ellipse cx="250" cy="460" rx="140" ry="20" fill="#000" opacity="0.1"/>
    
    <!-- Serveur cassé -->
    <g transform="translate(250, 280)">
      <!-- Partie supérieure du serveur (cassée) -->
      <g transform="rotate(-8)">
        <rect x="-80" y="-100" width="160" height="80" rx="8" fill="#666" stroke="#444" stroke-width="3"/>
        <rect x="-70" y="-85" width="140" height="20" rx="4" fill="#888"/>
        <rect x="-70" y="-55" width="140" height="20" rx="4" fill="#888"/>
        <!-- LEDs -->
        <circle cx="-55" cy="-75" r="4" fill="#dc3545"/>
        <circle cx="-40" cy="-75" r="4" fill="#dc3545"/>
        <circle cx="-55" cy="-45" r="4" fill="#ffc107"/>
        <circle cx="-40" cy="-45" r="4" fill="#dc3545"/>
        <!-- Fissure -->
        <path d="M 20,-100 L 15,-60 L 25,-40 L 20,-20" stroke="#dc3545" stroke-width="3" fill="none"/>
      </g>
      
      <!-- Partie inférieure du serveur -->
      <g transform="rotate(5)">
        <rect x="-80" y="30" width="160" height="80" rx="8" fill="#666" stroke="#444" stroke-width="3"/>
        <rect x="-70" y="45" width="140" height="20" rx="4" fill="#888"/>
        <rect x="-70" y="75" width="140" height="20" rx="4" fill="#888"/>
        <!-- LEDs -->
        <circle cx="-55" cy="55" r="4" fill="#dc3545"/>
        <circle cx="-40" cy="55" r="4" fill="#dc3545"/>
        <circle cx="-55" cy="85" r="4" fill="#dc3545"/>
      </g>
    </g>
    
    <!-- Triangles d'avertissement -->
    <g transform="translate(120, 200)">
      <polygon points="0,-30 -26,20 26,20" fill="#dc3545"/>
      <polygon points="0,-30 -26,20 26,20" fill="none" stroke="#b71c1c" stroke-width="2"/>
      <text x="0" y="15" font-size="35" font-weight="bold" fill="#fff" text-anchor="middle">!</text>
    </g>
    
    <g transform="translate(380, 250)">
      <polygon points="0,-25 -22,17 22,17" fill="#ff9800"/>
      <polygon points="0,-25 -22,17 22,17" fill="none" stroke="#f57c00" stroke-width="2"/>
      <text x="0" y="12" font-size="30" font-weight="bold" fill="#fff" text-anchor="middle">!</text>
    </g>
    
    <!-- Engrenages cassés -->
    <g transform="translate(100, 380)">
      <circle cx="0" cy="0" r="30" fill="#dc3545"/>
      <circle cx="0" cy="0" r="18" fill="#fff"/>
      <!-- Dents cassées -->
      <rect x="-6" y="-35" width="12" height="10" fill="#dc3545"/>
      <rect x="-6" y="25" width="12" height="10" fill="#dc3545"/>
      <rect x="-35" y="-6" width="10" height="12" fill="#dc3545"/>
      <rect x="25" y="-6" width="10" height="12" fill="#dc3545"/>
      <!-- Fissure -->
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#b71c1c" stroke-width="3"/>
    </g>
    
    <g transform="translate(400, 380)">
      <circle cx="0" cy="0" r="25" fill="#ff9800"/>
      <circle cx="0" cy="0" r="15" fill="#fff"/>
      <!-- Dents -->
      <rect x="-5" y="-30" width="10" height="8" fill="#ff9800"/>
      <rect x="-5" y="22" width="10" height="8" fill="#ff9800"/>
      <rect x="-30" y="-5" width="8" height="10" fill="#ff9800"/>
    </g>
    
    <!-- Outils (clé et tournevis) -->
    <g transform="translate(320, 150) rotate(25)">
      <rect x="0" y="-4" width="70" height="8" fill="#666" rx="2"/>
      <circle cx="65" cy="0" r="14" fill="#666"/>
      <circle cx="65" cy="0" r="10" fill="none" stroke="#888" stroke-width="2"/>
    </g>
    
    <!-- Étincelles/Particules -->
    <circle cx="200" cy="180" r="3" fill="#ffc107"/>
    <circle cx="340" cy="320" r="4" fill="#dc3545"/>
    <circle cx="160" cy="300" r="3" fill="#ff9800"/>
    <path d="M 380 180 L 385 190 L 390 180 L 385 185 Z" fill="#ffc107"/>
  </g>
</svg>
