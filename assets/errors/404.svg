<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <g opacity="0.9">
    <!-- Personne avec télescope/jumelles -->
    <ellipse cx="250" cy="450" rx="100" ry="25" fill="#f0ad4e" opacity="0.2"/>
    
    <!-- Corps -->
    <rect x="225" y="350" width="50" height="100" rx="25" fill="#f0ad4e"/>
    <circle cx="250" cy="310" r="35" fill="#f0ad4e"/>
    
    <!-- Bras tenant jumelles -->
    <path d="M 225 360 Q 180 350 160 320" stroke="#f0ad4e" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 275 360 Q 320 350 340 320" stroke="#f0ad4e" stroke-width="18" stroke-linecap="round" fill="none"/>
    
    <!-- Jumelles/Télescope -->
    <g transform="translate(250, 280)">
      <ellipse cx="-15" cy="-25" rx="12" ry="18" fill="#ff9800"/>
      <ellipse cx="15" cy="-25" rx="12" ry="18" fill="#ff9800"/>
      <rect x="-20" y="-30" width="40" height="8" fill="#ff9800" rx="2"/>
      <circle cx="-15" cy="-25" r="8" fill="#fff" opacity="0.3"/>
      <circle cx="15" cy="-25" r="8" fill="#fff" opacity="0.3"/>
    </g>
    
    <!-- Points d'interrogation flottants -->
    <g fill="#ffc107">
      <text x="100" y="150" font-size="60" font-weight="bold" font-family="Arial">?</text>
      <text x="350" y="200" font-size="50" font-weight="bold" font-family="Arial">?</text>
      <text x="120" y="280" font-size="40" font-weight="bold" font-family="Arial">?</text>
      <text x="380" y="320" font-size="55" font-weight="bold" font-family="Arial">?</text>
    </g>
    
    <!-- Carte/Boussole au sol -->
    <g transform="translate(100, 400)">
      <rect x="0" y="0" width="80" height="60" fill="#fff" stroke="#ddd" stroke-width="2" rx="3"/>
      <line x1="10" y1="15" x2="70" y2="15" stroke="#f0ad4e" stroke-width="2"/>
      <line x1="10" y1="25" x2="50" y2="25" stroke="#ccc" stroke-width="2"/>
      <line x1="10" y1="35" x2="60" y2="35" stroke="#ccc" stroke-width="2"/>
      <line x1="10" y1="45" x2="40" y2="45" stroke="#ccc" stroke-width="2"/>
    </g>
    
    <!-- Boussole -->
    <g transform="translate(380, 420)">
      <circle cx="0" cy="0" r="30" fill="#fff" stroke="#f0ad4e" stroke-width="3"/>
      <polygon points="0,-20 -5,10 0,5 5,10" fill="#dc3545"/>
      <polygon points="0,20 -5,-10 0,-5 5,-10" fill="#666"/>
      <circle cx="0" cy="0" r="3" fill="#333"/>
    </g>
    
    <!-- Étoiles/Particules de recherche -->
    <circle cx="80" cy="100" r="4" fill="#ffc107"/>
    <circle cx="420" cy="140" r="5" fill="#ff9800"/>
    <circle cx="60" cy="250" r="3" fill="#ffc107"/>
    <circle cx="440" cy="280" r="4" fill="#ff9800"/>
    <path d="M 200 80 L 205 90 L 210 80 L 205 85 Z" fill="#ffc107"/>
    <path d="M 320 120 L 325 130 L 330 120 L 325 125 Z" fill="#ff9800"/>
  </g>
</svg>
